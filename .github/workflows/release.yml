name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build merged artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          gradle_cmd="gradle"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            gradle_cmd="./gradlew"
          fi
          "$gradle_cmd" --no-daemon clean deploy

      - name: Verify mod descriptor in jar
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(ls dist/*.jar | head -1)
          if ! unzip -l "$jar_file" | grep -qE 'mod\.(json|hjson)'; then
            echo "ERROR: $jar_file is missing mod.json/mod.hjson" >&2
            exit 1
          fi
          echo "OK: $jar_file contains a mod descriptor"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/*.jar
            dist/*.zip
